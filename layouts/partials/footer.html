{{ if site.Params.theme_config.isShowFooter }}
<footer class="footer wrap pale">
  <div style="text-align: center; margin-bottom: 8px;">
    <button id="theme-toggle" style="background: none; color: inherit; border: 1px solid currentColor; border-radius: 4px; cursor: pointer; padding: 2px 10px; font-family: monospace;">L / D</button>
  </div>
  <div style="display: flex; justify-content: flex-end; align-items: center; gap: 1ch; margin: 7px 0;">
    <p style="margin: 0;">&copy;&nbsp;{{ now.Format "2006" }}&nbsp;<a href="{{ site.Params.copyrighturl }}" style="text-decoration: none;">{{ site.Params.copyright }}</a></p>
    <a href="https://creativecommons.org/licenses/by-nc/4.0/" aria-label="CC BY-NC 4.0" style="display: flex; align-items: center; gap: 3px; flex-shrink: 0;">
      <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="height: 20px; margin: 0; display: block;">
      <img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="height: 20px; margin: 0; display: block;">
      <img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="" style="height: 20px; margin: 0; display: block;">
    </a>
    <img src="/images/written-by-human/svg/Written-By-Humans-Not-By-AI-Badge-black.svg" alt="Written by Humans" style="height: 20px; margin: 0; display: block; flex-shrink: 0;">
    <img src="https://www.easycounter.com/counter.php?ahaooahaz" border="0" alt="Hit Counters" style="height: 20px; margin: 0; display: block; flex-shrink: 0;">
  </div>
</footer>
{{ end }}
